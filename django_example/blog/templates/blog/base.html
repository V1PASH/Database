<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}minidb + Django{% endblock %}</title>
  <style>
    body { font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           margin: 0; background: #0d1017; color: #e4e7ee; }
    header { padding: 18px 28px; border-bottom: 1px solid #262c39; background: #151922;
             display: flex; align-items: baseline; gap: 14px; }
    header b { font-size: 17px; }
    header span { color: #8891a5; font-size: 13px; }
    main { max-width: 760px; margin: 0 auto; padding: 28px; }
    a { color: #6ea8fe; text-decoration: none; }
    a:hover { text-decoration: underline; }
    article { border: 1px solid #262c39; background: #151922; border-radius: 8px;
              padding: 16px 18px; margin-bottom: 14px; }
    article h2 { margin: 0 0 6px; font-size: 17px; }
    .meta { color: #8891a5; font-size: 12.5px; font-family: ui-monospace, Menlo, monospace; }
    form { margin-top: 18px; }
    input, textarea { width: 100%; box-sizing: border-box; font: 14px ui-monospace, Menlo, monospace;
                      background: #0e121a; color: #e4e7ee; border: 1px solid #262c39;
                      border-radius: 6px; padding: 9px 11px; margin-bottom: 10px; }
    button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid #3d63a0;
             background: #2b4a7d; color: #eaf2ff; padding: 8px 16px; }
    .empty { border: 1px dashed #262c39; border-radius: 8px; padding: 34px; text-align: center; color: #8891a5; }
    .tag { display: inline-block; font-size: 11.5px; background: #1b202b; border: 1px solid #262c39;
           border-radius: 20px; padding: 1px 9px; margin-right: 5px; color: #a5d6ff; }
  </style>
</head>
<body>
  <header>
    <b>minidb + Django</b>
    <span>articles and comments live in minidb</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
