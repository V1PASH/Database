name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test on python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      # A real MongoDB, so the parity suite runs for real rather than
      # skipping itself.
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: lint
        run: python -m pyflakes minidb app schemas bench tests

      - name: test
        run: pytest tests/ -q
        env:
          MONGO_URI: mongodb://127.0.0.1:27017

  frontend:
    name: the browser code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: smoke test
        run: node tests/frontend_smoke.mjs

  package:
    name: build the package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: build
        run: python -m build

      - name: check the metadata
        run: python -m twine check dist/*

      - name: install the wheel somewhere clean
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/python -c "import minidb; print(minidb.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
