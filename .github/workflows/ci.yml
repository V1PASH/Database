name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test on python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: start mongodb
        run: |
          # MongoDB 8.0+ crashes on Linux kernels 6.19 and newer
          # (SERVER-121912), which the GitHub runners have started using.
          # The 8.2 line is unaffected, so try the newest images first and
          # fall back to one that boots.
          for image in mongo:9.0.4 mongo:8.2.12 mongo:8.0.34 mongo:7.0.45; do
            docker rm -f mongo >/dev/null 2>&1 || true
            echo "trying $image"
            if ! docker run -d --name mongo -p 27017:27017 "$image" >/dev/null 2>&1; then
              echo "  could not start the container"
              continue
            fi
            for attempt in $(seq 1 20); do
              if docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1; then
                echo "::notice::MongoDB is up, from $image"
                exit 0
              fi
              sleep 2
            done
            echo "  did not come up:"
            docker logs mongo 2>&1 | tail -4
          done
          echo "::warning::No MongoDB image would start, so the parity tests will be skipped."

      - name: lint
        run: python -m pyflakes minidb app schemas bench tests

      - name: test
        run: pytest tests/ -q
        env:
          MONGO_URI: mongodb://127.0.0.1:27017

  frontend:
    name: the browser code
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: smoke test
        run: node tests/frontend_smoke.mjs

  package:
    name: build the package
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: build
        run: python -m build

      - name: check the metadata
        run: python -m twine check dist/*

      - name: install the wheel somewhere clean
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/python -c "import minidb; print(minidb.__version__)"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
